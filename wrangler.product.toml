# The product build: the page, and no data. Each person's notes are in their
# own Dropbox; the page talks to Dropbox (and Lemon Squeezy for license keys)
# directly. The only Worker code is Google sign-in's token swap
# (worker/product.js), which keeps nothing. Deploy with `npm run deploy:product`.
#
# For Google, once: npx wrangler secret put GOOGLE_CLIENT_ID -c wrangler.product.toml
#                    npx wrangler secret put GOOGLE_CLIENT_SECRET -c wrangler.product.toml
name = "wr1t3r-user"
main = "worker/product.js"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [{ pattern = "my.wr1t3r.app", custom_domain = true }]

[assets]
directory = "./dist-product"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
