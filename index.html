<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="light dark">
	<meta name="theme-color" content="#fbfaf7">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="wr1t3r">
	<link rel="manifest" href="/manifest.webmanifest">
	<link rel="icon" href="/icon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="/icon-180.png">
	<title>wr1t3r</title>
	<script src="/theme.js"></script>
	<link rel="stylesheet" href="/src/style.css">
</head>
<body>
	<form id="login" hidden>
		<h1>wr1t3r</h1>
		<p>Paste your wr1t3r token. It stays on this device.</p>
		<input id="token" type="password" autocomplete="current-password" placeholder="Token" required>
		<button type="submit">Continue</button>
		<p id="login-error" class="error" role="alert"></p>
	</form>

	<div id="app" hidden>
		<aside id="sidebar">
			<div class="side-top">
				<input id="filter" type="search" placeholder="Search notes" aria-label="Search notes">
				<button id="new" type="button" title="New note">New</button>
				<button id="upload" type="button" title="Upload files as notes (Word, PDF, HTML, text)">Upload</button>
				<button id="clip" type="button" title="Clip a web page as a note">Clip</button>
				<input id="upload-input" type="file" multiple hidden>
			</div>
			<nav id="tree" aria-label="Notes"></nav>
			<div class="side-bottom">
				<button id="signout" type="button" class="quiet">Sign out</button>
			</div>
		</aside>
		<div id="scrim"></div>
		<main>
			<header>
				<button id="menu" type="button" aria-label="Notes">☰</button>
				<input id="path" aria-label="Note path (edit and press Enter to rename)" spellcheck="false" disabled>
				<button id="status" type="button" title="Sync now"></button>
				<button id="calBtn" type="button" class="quiet" aria-label="Agenda" aria-expanded="false" aria-controls="agenda">
					<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
					<span id="calNext"></span>
				</button>
				<button id="settingsBtn" type="button" class="quiet" aria-label="Display settings" aria-expanded="false" aria-controls="settings">Aa</button>
				<button id="delete" type="button" class="quiet" title="Delete note" disabled>Delete</button>
			</header>
			<div id="editor"></div>
			<div id="empty">Pick a note, or make a new one.</div>
			<footer id="bar">
				<span class="pomo">
					<button id="pomo" type="button" class="quiet"></button>
					<button id="pomoReset" type="button" class="quiet" aria-label="Reset timer" title="Reset timer" hidden>↺</button>
				</span>
				<button id="count" type="button" class="quiet" title="Switch between words and characters"></button>
			</footer>
		</main>
		<div id="settings" class="pop" hidden>
			<h2>Theme</h2>
			<div class="seg" id="themes">
				<button type="button" data-theme="auto">Auto</button>
				<button type="button" data-theme="light">Light</button>
				<button type="button" data-theme="dark">Dark</button>
				<button type="button" data-theme="sepia">Sepia</button>
			</div>
			<h2>Text size</h2>
			<div class="seg">
				<button id="smaller" type="button" aria-label="Smaller text">A&minus;</button>
				<span id="sizeVal" class="val">19</span>
				<button id="larger" type="button" aria-label="Larger text">A+</button>
			</div>
			<h2>Focus length</h2>
			<div class="seg">
				<button id="workLess" type="button" aria-label="Shorter focus blocks">&minus;</button>
				<span id="workVal" class="val"></span>
				<button id="workMore" type="button" aria-label="Longer focus blocks">+</button>
			</div>
			<h2>Break length</h2>
			<div class="seg">
				<button id="breakLess" type="button" aria-label="Shorter breaks">&minus;</button>
				<span id="breakVal" class="val"></span>
				<button id="breakMore" type="button" aria-label="Longer breaks">+</button>
			</div>
			<h2>Clip from any page</h2>
			<p class="hint">Drag <a id="bookmarklet" href="#">Clip to wr1t3r</a> to your bookmarks bar, then click it on any page. On iPhone, see the README for adding it to Safari.</p>
		</div>
		<div id="agenda" class="pop" hidden>
			<div class="agenda-top">
				<h2>Agenda</h2>
				<button id="addEventBtn" type="button">+ Add event</button>
			</div>
			<div id="calFilters" role="group" aria-label="Calendars to show"></div>
			<form id="addEvent" hidden>
				<input id="evTitle" placeholder="Title" required maxlength="500" aria-label="Event title">
				<label class="check"><input id="evAllDay" type="checkbox"> All day</label>
				<div class="row">
					<input id="evDate" type="date" required aria-label="Date">
					<input id="evEndDate" type="date" aria-label="Last day" hidden>
				</div>
				<div class="row" id="evTimes">
					<input id="evStart" type="time" required aria-label="Starts">
					<span>to</span>
					<input id="evEnd" type="time" required aria-label="Ends">
				</div>
				<label class="row" id="evCalendarRow">Calendar
					<select id="evCalendar" aria-label="Calendar"></select>
				</label>
				<input id="evLocation" placeholder="Location (optional)" maxlength="1000" aria-label="Location">
				<label class="row">Reminder
					<select id="evReminder" aria-label="Reminder">
						<option value="">Calendar default</option>
						<option value="0">At start</option>
						<option value="5">5 min before</option>
						<option value="10">10 min before</option>
						<option value="30">30 min before</option>
						<option value="60">1 hour before</option>
						<option value="1440">1 day before</option>
						<option value="none">None</option>
					</select>
				</label>
				<div class="row end">
					<button id="evCancel" type="button" class="quiet">Cancel</button>
					<button type="submit">Add to Google Calendar</button>
				</div>
				<p id="evError" class="error" role="alert"></p>
			</form>
			<div id="agendaList"></div>
			<p id="agendaNote" class="hint"></p>
		</div>
		<div id="toast" role="status" hidden></div>
	</div>
	<script type="module" src="/src/main.js"></script>
</body>
</html>
