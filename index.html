<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#1b1b1d" media="(prefers-color-scheme: dark)">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="wr1t3r">
	<link rel="manifest" href="/manifest.webmanifest">
	<link rel="icon" href="/icon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="/icon-180.png">
	<title>wr1t3r</title>
	<link rel="stylesheet" href="/src/style.css">
</head>
<body>
	<form id="login" hidden>
		<h1>wr1t3r</h1>
		<p>Paste your wr1t3r token. It stays on this device.</p>
		<input id="token" type="password" autocomplete="current-password" placeholder="Token" required>
		<button type="submit">Continue</button>
		<p id="login-error" class="error" role="alert"></p>
	</form>

	<div id="app" hidden>
		<aside id="sidebar">
			<div class="side-top">
				<input id="filter" type="search" placeholder="Search notes" aria-label="Search notes">
				<button id="new" type="button" title="New note">New</button>
				<button id="upload" type="button" title="Upload files as notes (Word, PDF, HTML, text)">Upload</button>
				<input id="upload-input" type="file" multiple hidden>
			</div>
			<nav id="tree" aria-label="Notes"></nav>
			<div class="side-bottom">
				<button id="signout" type="button" class="quiet">Sign out</button>
			</div>
		</aside>
		<div id="scrim"></div>
		<main>
			<header>
				<button id="menu" type="button" aria-label="Notes">☰</button>
				<input id="path" aria-label="Note path (edit and press Enter to rename)" spellcheck="false" disabled>
				<button id="status" type="button" title="Sync now"></button>
				<button id="delete" type="button" class="quiet" title="Delete note" disabled>Delete</button>
			</header>
			<div id="editor"></div>
			<div id="empty">Pick a note, or make a new one.</div>
		</main>
		<div id="toast" role="status" hidden></div>
	</div>
	<script type="module" src="/src/main.js"></script>
</body>
</html>
